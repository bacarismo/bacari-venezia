name: Aggiorna dati e pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # ogni lunedì alle 5 (ora italiana)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Scarica locali (OpenStreetMap) e orari (ACTV)
        # Su push che toccano solo l'app si riusano i dati già online (molto più veloce);
        # ogni lunedì, o se cambiano script/preferiti, si riscarica tutto.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD^ HEAD | grep -qE '^(scripts/|data/)' \
             && python scripts/build_data.py --riusa "$SITO_PUBBLICATO"; then
            echo "Dati riusati dal sito"
          else
            python scripts/build_data.py
          fi
        env:
          SITO_PUBBLICATO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html style.css app.js gioco.js orari.js routing.js config.js cripto.js cifra.html sw.js manifest.webmanifest icons data _site/
          V=$(date +%Y%m%d%H%M)
          sed -i "s/const VERSION = \"v1\"/const VERSION = \"$V\"/" _site/sw.js
          sed -i "s/__V__/$V/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
